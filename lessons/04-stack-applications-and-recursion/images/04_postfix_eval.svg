<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="100%" height="100%">
  <rect width="760" height="230" rx="10" fill="#181816" stroke="#383733" stroke-width="1.5"/>
  <text x="30" y="34" fill="#faf6ee" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700">Postfix (RPN) Evaluation: Single-Pass Stack Reduction</text>
  <text x="30" y="52" fill="#9e978c" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Trace of "5 3 + 2 *" through operand stack</text>

  <!-- Step 1: Push 5, 3 -->
  <g transform="translate(40, 75)">
    <rect width="115" height="130" rx="6" fill="#141413" stroke="#52504a"/>
    <text x="57" y="22" fill="#9e978c" font-family="monospace" font-size="11" text-anchor="middle">Step 1: Read '5', '3'</text>
    
    <rect x="20" y="90" width="75" height="24" rx="3" fill="#2a2a26" stroke="#cc785c"/>
    <text x="57" y="106" fill="#faf6ee" font-family="monospace" font-size="12" text-anchor="middle">5</text>
    <rect x="20" y="60" width="75" height="24" rx="3" fill="#2a2a26" stroke="#cc785c"/>
    <text x="57" y="76" fill="#faf6ee" font-family="monospace" font-size="12" text-anchor="middle">3 (top)</text>
  </g>

  <!-- Step 2: Read '+' -->
  <g transform="translate(180, 75)">
    <rect width="125" height="130" rx="6" fill="#1c1c1a" stroke="#cc785c"/>
    <text x="62" y="22" fill="#e08d73" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Step 2: Read '+'</text>
    <text x="62" y="45" fill="#9e978c" font-family="monospace" font-size="10" text-anchor="middle">val2 = pop() → 3</text>
    <text x="62" y="60" fill="#9e978c" font-family="monospace" font-size="10" text-anchor="middle">val1 = pop() → 5</text>
    
    <rect x="25" y="80" width="75" height="28" rx="3" fill="#22382b" stroke="#22c55e"/>
    <text x="62" y="98" fill="#4ade80" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">push(8)</text>
  </g>

  <!-- Step 3: Read '2' -->
  <g transform="translate(330, 75)">
    <rect width="115" height="130" rx="6" fill="#141413" stroke="#52504a"/>
    <text x="57" y="22" fill="#9e978c" font-family="monospace" font-size="11" text-anchor="middle">Step 3: Read '2'</text>
    
    <rect x="20" y="90" width="75" height="24" rx="3" fill="#2a2a26" stroke="#cc785c"/>
    <text x="57" y="106" fill="#faf6ee" font-family="monospace" font-size="12" text-anchor="middle">8</text>
    <rect x="20" y="60" width="75" height="24" rx="3" fill="#2a2a26" stroke="#cc785c"/>
    <text x="57" y="76" fill="#faf6ee" font-family="monospace" font-size="12" text-anchor="middle">2 (top)</text>
  </g>

  <!-- Step 4: Read '*' -->
  <g transform="translate(470, 75)">
    <rect width="125" height="130" rx="6" fill="#1c1c1a" stroke="#cc785c"/>
    <text x="62" y="22" fill="#e08d73" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Step 4: Read '*'</text>
    <text x="62" y="45" fill="#9e978c" font-family="monospace" font-size="10" text-anchor="middle">val2 = pop() → 2</text>
    <text x="62" y="60" fill="#9e978c" font-family="monospace" font-size="10" text-anchor="middle">val1 = pop() → 8</text>
    
    <rect x="25" y="80" width="75" height="28" rx="3" fill="#22382b" stroke="#22c55e"/>
    <text x="62" y="98" fill="#4ade80" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">push(16)</text>
  </g>

  <!-- Step 5: Final Result -->
  <g transform="translate(620, 75)">
    <rect width="105" height="130" rx="6" fill="#15241b" stroke="#22c55e"/>
    <text x="52" y="22" fill="#4ade80" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Step 5: Done</text>
    <text x="52" y="55" fill="#9e978c" font-family="sans-serif" font-size="11" text-anchor="middle">Final Result</text>
    <text x="52" y="95" fill="#4ade80" font-family="monospace" font-size="28" font-weight="700" text-anchor="middle">16</text>
  </g>
</svg>
