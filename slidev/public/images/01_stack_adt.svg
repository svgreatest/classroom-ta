<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="100%" height="100%">
  <rect width="760" height="260" rx="10" fill="#181816" stroke="#383733" stroke-width="1.5"/>
  <text x="30" y="38" fill="#faf6ee" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700">Generic Stack Memory Model &amp; Operations</text>
  <text x="30" y="60" fill="#9e978c" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Contiguous heap buffer parameterized by elem_size, manipulated strictly at top</text>

  <!-- Stack container -->
  <g transform="translate(60, 90)">
    <!-- Base frame -->
    <rect x="0" y="0" width="220" height="130" rx="6" fill="#141413" stroke="#52504a" stroke-width="1.5"/>
    <text x="110" y="24" fill="#9e978c" font-family="monospace" font-size="11" text-anchor="middle">GenericStack (Heap)</text>
    
    <!-- Slots -->
    <rect x="25" y="92" width="170" height="26" rx="4" fill="#2a2a26" stroke="#cc785c" stroke-width="1.2"/>
    <text x="110" y="109" fill="#faf6ee" font-family="monospace" font-size="11" text-anchor="middle">elem[0] (offset 0)</text>
    
    <rect x="25" y="62" width="170" height="26" rx="4" fill="#2a2a26" stroke="#cc785c" stroke-width="1.2"/>
    <text x="110" y="79" fill="#faf6ee" font-family="monospace" font-size="11" text-anchor="middle">elem[1] (offset 1×size)</text>
    
    <rect x="25" y="32" width="170" height="26" rx="4" fill="#322822" stroke="#e08d73" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="110" y="49" fill="#e08d73" font-family="monospace" font-size="11" text-anchor="middle">next free slot (top)</text>
  </g>

  <!-- Arrows and Labels -->
  <!-- Top pointer -->
  <g transform="translate(300, 120)">
    <path d="M 0 12 L 60 12" stroke="#e08d73" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="75" y="16" fill="#e08d73" font-family="monospace" font-size="13" font-weight="700">top = 2</text>
    <text x="75" y="35" fill="#9e978c" font-family="monospace" font-size="11">stack_size = 2</text>
  </g>

  <!-- Operations Panel -->
  <g transform="translate(480, 85)">
    <rect x="0" y="0" width="240" height="135" rx="6" fill="#1c1c1a" stroke="#383733" stroke-width="1"/>
    
    <!-- Push -->
    <g transform="translate(15, 25)">
      <circle cx="10" cy="10" r="10" fill="#22382b"/>
      <text x="10" y="14" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">↓</text>
      <text x="30" y="14" fill="#4ade80" font-family="monospace" font-size="12" font-weight="700">stack_push(&amp;val)</text>
      <text x="30" y="28" fill="#9e978c" font-family="sans-serif" font-size="10">memcpy to buffer + (top × size); top++</text>
    </g>

    <!-- Pop -->
    <g transform="translate(15, 75)">
      <circle cx="10" cy="10" r="10" fill="#3d2626"/>
      <text x="10" y="14" fill="#f87171" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">↑</text>
      <text x="30" y="14" fill="#f87171" font-family="monospace" font-size="12" font-weight="700">stack_pop(&amp;out)</text>
      <text x="30" y="28" fill="#9e978c" font-family="sans-serif" font-size="10">top--; memcpy from buffer + (top × size)</text>
    </g>
  </g>
</svg>
