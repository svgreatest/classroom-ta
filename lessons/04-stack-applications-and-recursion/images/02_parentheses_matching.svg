<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="100%" height="100%">
  <rect width="760" height="240" rx="10" fill="#181816" stroke="#383733" stroke-width="1.5"/>
  <text x="30" y="36" fill="#faf6ee" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700">Balanced Parentheses: Nested Scopes vs. Illegal Cross-Nesting</text>
  <text x="30" y="56" fill="#9e978c" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">LIFO discipline requires the most recently opened scope to close first</text>

  <!-- Valid Case -->
  <g transform="translate(40, 80)">
    <rect width="320" height="130" rx="6" fill="#15241b" stroke="#22c55e" stroke-width="1.2"/>
    <text x="20" y="28" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700">Valid: Strictly Nested Scopes</text>
    
    <!-- Token string -->
    <text x="50" y="65" fill="#faf6ee" font-family="monospace" font-size="22" letter-spacing="18">{ [ ( ) ] }</text>
    
    <!-- Arcs -->
    <!-- ( ) -->
    <path d="M 125 72 C 125 90, 155 90, 155 72" fill="none" stroke="#4ade80" stroke-width="2"/>
    <!-- [ ] -->
    <path d="M 90 72 C 90 105, 190 105, 190 72" fill="none" stroke="#4ade80" stroke-width="2"/>
    <!-- { } -->
    <path d="M 55 72 C 55 120, 225 120, 225 72" fill="none" stroke="#4ade80" stroke-width="2"/>
  </g>

  <!-- Invalid Case -->
  <g transform="translate(400, 80)">
    <rect width="320" height="130" rx="6" fill="#2d1717" stroke="#ef4444" stroke-width="1.2"/>
    <text x="20" y="28" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700">Invalid: Crossed Scopes</text>
    
    <!-- Token string -->
    <text x="90" y="65" fill="#faf6ee" font-family="monospace" font-size="22" letter-spacing="24">[ ( ] )</text>
    
    <!-- Arcs crossing -->
    <path d="M 98 72 C 98 110, 180 110, 180 72" fill="none" stroke="#f87171" stroke-width="2"/>
    <path d="M 138 72 C 138 110, 222 110, 222 72" fill="none" stroke="#f87171" stroke-width="2"/>
    
    <text x="160" y="115" fill="#fca5a5" font-family="monospace" font-size="11" text-anchor="middle">Crossing violates LIFO order</text>
  </g>
</svg>
