<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="100%" height="100%">
  <rect width="760" height="250" rx="10" fill="#181816" stroke="#383733" stroke-width="1.5"/>
  <text x="30" y="34" fill="#faf6ee" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700">CPU Architecture &amp; The Runtime Call Stack</text>
  <text x="30" y="52" fill="#9e978c" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Each recursive invocation pushes an independent activation record containing parameters, locals, and return address</text>

  <!-- Process Memory Layout -->
  <g transform="translate(40, 75)">
    <text x="75" y="14" fill="#9e978c" font-family="monospace" font-size="11" text-anchor="middle">Process Address Space</text>
    
    <rect x="0" y="24" width="150" height="25" fill="#222" stroke="#444"/>
    <text x="75" y="41" fill="#888" font-family="monospace" font-size="10" text-anchor="middle">Text / Code</text>

    <rect x="0" y="49" width="150" height="25" fill="#222" stroke="#444"/>
    <text x="75" y="66" fill="#888" font-family="monospace" font-size="10" text-anchor="middle">Data / BSS</text>

    <rect x="0" y="74" width="150" height="30" fill="#1c2d20" stroke="#16a34a"/>
    <text x="75" y="93" fill="#4ade80" font-family="monospace" font-size="10" text-anchor="middle">Heap (malloc) ↓</text>

    <rect x="0" y="104" width="150" height="35" fill="#2d1d16" stroke="#ea580c"/>
    <text x="75" y="126" fill="#fb923c" font-family="monospace" font-size="10" text-anchor="middle">Stack (frames) ↑</text>
  </g>

  <!-- Active Stack Frames for factorial(3) -->
  <g transform="translate(240, 75)">
    <text x="110" y="14" fill="#faf6ee" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700">Active Frames: factorial(3)</text>
    
    <!-- main frame -->
    <rect x="0" y="24" width="220" height="32" rx="4" fill="#1c1c1a" stroke="#52504a"/>
    <text x="15" y="45" fill="#faf6ee" font-family="monospace" font-size="11">main() frame</text>
    <text x="175" y="45" fill="#9e978c" font-family="monospace" font-size="10">n = 3</text>

    <!-- factorial(3) -->
    <rect x="0" y="60" width="220" height="32" rx="4" fill="#2a221a" stroke="#cc785c"/>
    <text x="15" y="81" fill="#e08d73" font-family="monospace" font-size="11">factorial(3) frame</text>
    <text x="175" y="81" fill="#9e978c" font-family="monospace" font-size="10">ret main</text>

    <!-- factorial(2) -->
    <rect x="0" y="96" width="220" height="32" rx="4" fill="#2a221a" stroke="#cc785c"/>
    <text x="15" y="117" fill="#e08d73" font-family="monospace" font-size="11">factorial(2) frame</text>
    <text x="175" y="117" fill="#9e978c" font-family="monospace" font-size="10">ret f(3)</text>

    <!-- factorial(1) -->
    <rect x="0" y="132" width="220" height="32" rx="4" fill="#321b1b" stroke="#f87171"/>
    <text x="15" y="153" fill="#f87171" font-family="monospace" font-size="11">factorial(1) (Base)</text>
    <text x="175" y="153" fill="#f87171" font-family="monospace" font-size="10">ret f(2)</text>
  </g>

  <!-- Frame Anatomy Breakdown -->
  <g transform="translate(500, 75)">
    <rect width="220" height="140" rx="6" fill="#141413" stroke="#cc785c" stroke-width="1.2"/>
    <text x="110" y="22" fill="#e08d73" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">Activation Record Anatomy</text>
    
    <text x="20" y="48" fill="#faf6ee" font-family="monospace" font-size="10">1. Return Address (%rip)</text>
    <text x="20" y="68" fill="#faf6ee" font-family="monospace" font-size="10">2. Saved Frame Pointer (%rbp)</text>
    <text x="20" y="88" fill="#faf6ee" font-family="monospace" font-size="10">3. Parameters (n)</text>
    <text x="20" y="108" fill="#faf6ee" font-family="monospace" font-size="10">4. Local Variables &amp; Temps</text>
    
    <text x="110" y="130" fill="#4ade80" font-family="sans-serif" font-size="10" text-anchor="middle">Popped on return; pushes on call</text>
  </g>
</svg>
