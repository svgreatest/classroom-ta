<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="100%" height="100%">
  <rect width="760" height="250" rx="10" fill="#181816" stroke="#383733" stroke-width="1.5"/>
  <text x="30" y="36" fill="#faf6ee" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700">Dijkstra's Shunting-Yard Railroad Model</text>
  <text x="30" y="56" fill="#9e978c" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Operands bypass directly to the output; operators hold on the siding stack until precedence permits departure</text>

  <!-- Railroad Track Graphic -->
  <!-- Infix Input Track -->
  <g transform="translate(40, 100)">
    <line x1="0" y1="30" x2="220" y2="30" stroke="#52504a" stroke-width="4"/>
    <text x="10" y="18" fill="#9e978c" font-family="monospace" font-size="12">Input: Infix Stream</text>
    
    <!-- Token cars -->
    <rect x="20" y="38" width="35" height="24" rx="3" fill="#2a2a26" stroke="#cc785c"/>
    <text x="37" y="54" fill="#faf6ee" font-family="monospace" font-size="12" text-anchor="middle">A</text>
    
    <rect x="65" y="38" width="35" height="24" rx="3" fill="#322822" stroke="#e08d73"/>
    <text x="82" y="54" fill="#e08d73" font-family="monospace" font-size="12" text-anchor="middle">+</text>

    <rect x="110" y="38" width="35" height="24" rx="3" fill="#2a2a26" stroke="#cc785c"/>
    <text x="127" y="54" fill="#faf6ee" font-family="monospace" font-size="12" text-anchor="middle">B</text>

    <rect x="155" y="38" width="35" height="24" rx="3" fill="#322822" stroke="#e08d73"/>
    <text x="172" y="54" fill="#e08d73" font-family="monospace" font-size="12" text-anchor="middle">*</text>

    <line x1="220" y1="30" x2="270" y2="30" stroke="#52504a" stroke-width="4"/>
  </g>

  <!-- Direct operand bypass -->
  <path d="M 310 130 L 480 130" stroke="#3b82f6" stroke-width="3" stroke-dasharray="4 4"/>
  <text x="395" y="118" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" text-anchor="middle">Operands bypass directly</text>

  <!-- Output Track -->
  <g transform="translate(480, 100)">
    <line x1="0" y1="30" x2="230" y2="30" stroke="#52504a" stroke-width="4"/>
    <text x="10" y="18" fill="#9e978c" font-family="monospace" font-size="12">Output: Postfix Stream</text>
    
    <rect x="30" y="38" width="40" height="24" rx="3" fill="#15241b" stroke="#22c55e"/>
    <text x="50" y="54" fill="#4ade80" font-family="monospace" font-size="12" text-anchor="middle">A</text>

    <rect x="80" y="38" width="40" height="24" rx="3" fill="#15241b" stroke="#22c55e"/>
    <text x="100" y="54" fill="#4ade80" font-family="monospace" font-size="12" text-anchor="middle">B</text>

    <rect x="130" y="38" width="40" height="24" rx="3" fill="#15241b" stroke="#22c55e"/>
    <text x="150" y="54" fill="#4ade80" font-family="monospace" font-size="12" text-anchor="middle">C</text>
  </g>

  <!-- Operator Stack Siding Track -->
  <g transform="translate(320, 130)">
    <path d="M 0 0 L 70 80" stroke="#cc785c" stroke-width="4"/>
    <rect x="40" y="50" width="100" height="45" rx="4" fill="#1c1c1a" stroke="#cc785c" stroke-width="1.5"/>
    <text x="90" y="68" fill="#e08d73" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Operator Siding</text>
    <text x="90" y="84" fill="#faf6ee" font-family="monospace" font-size="11" text-anchor="middle">(GenericStack)</text>
  </g>
</svg>
