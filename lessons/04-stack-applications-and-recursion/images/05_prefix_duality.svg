<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="100%" height="100%">
  <rect width="760" height="220" rx="10" fill="#181816" stroke="#383733" stroke-width="1.5"/>
  <text x="30" y="34" fill="#faf6ee" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700">The Infix-to-Prefix Transformation Pipeline</text>
  <text x="30" y="52" fill="#9e978c" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Reversal duality reuses the existing Shunting-Yard engine with inverted parentheses</text>

  <!-- Flowchart nodes -->
  <!-- 1. Input Infix -->
  <g transform="translate(40, 80)">
    <rect width="140" height="90" rx="6" fill="#1c1c1a" stroke="#52504a"/>
    <text x="70" y="24" fill="#9e978c" font-family="monospace" font-size="11" text-anchor="middle">1. Input Infix</text>
    <text x="70" y="55" fill="#faf6ee" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">(A + B) * C</text>
  </g>

  <path d="M 185 125 L 215 125" stroke="#cc785c" stroke-width="2"/>

  <!-- 2. Reverse & Invert Parens -->
  <g transform="translate(220, 80)">
    <rect width="150" height="90" rx="6" fill="#1c1c1a" stroke="#cc785c"/>
    <text x="75" y="24" fill="#e08d73" font-family="monospace" font-size="11" text-anchor="middle">2. Reverse &amp; Invert</text>
    <text x="75" y="55" fill="#faf6ee" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">C * (B + A)</text>
    <text x="75" y="75" fill="#9e978c" font-family="sans-serif" font-size="10" text-anchor="middle">'(' and ')' exchanged</text>
  </g>

  <path d="M 375 125 L 405 125" stroke="#cc785c" stroke-width="2"/>

  <!-- 3. Shunting-Yard Postfix -->
  <g transform="translate(410, 80)">
    <rect width="140" height="90" rx="6" fill="#1c1c1a" stroke="#52504a"/>
    <text x="70" y="24" fill="#9e978c" font-family="monospace" font-size="11" text-anchor="middle">3. Postfix Output</text>
    <text x="70" y="55" fill="#faf6ee" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle">C B A + *</text>
  </g>

  <path d="M 555 125 L 585 125" stroke="#cc785c" stroke-width="2"/>

  <!-- 4. Final Reverse = Prefix -->
  <g transform="translate(590, 80)">
    <rect width="130" height="90" rx="6" fill="#15241b" stroke="#22c55e"/>
    <text x="65" y="24" fill="#4ade80" font-family="monospace" font-size="11" text-anchor="middle">4. Final Prefix</text>
    <text x="65" y="55" fill="#4ade80" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">* + A B C</text>
    <text x="65" y="75" fill="#9e978c" font-family="sans-serif" font-size="10" text-anchor="middle">Reversed again</text>
  </g>
</svg>
